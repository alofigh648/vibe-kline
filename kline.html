<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>代码 K 线图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;
  --up:#3fb950;--dn:#f85149;--neu:#8b949e;
  --tip-bg:#1c2128;
}
body{background:var(--bg);color:var(--text);font-family:"SF Mono",Monaco,Consolas,monospace;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
#app{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 14px;gap:6px}
header{display:flex;align-items:center;gap:16px;flex-shrink:0}
.title{font-size:15px;font-weight:700;letter-spacing:.04em}
.subtitle{font-size:10px;color:var(--muted)}
#stats{display:flex;gap:16px;margin-left:auto;align-items:center}
.stat{text-align:right}
.stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-size:13px;font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}.neu{color:var(--neu)}
/* ── ticker ─────────────────────────────────────────── */
#ticker{
  height:22px;line-height:22px;overflow:hidden;flex-shrink:0;
  border:1px solid var(--border);border-radius:4px;
  background:rgba(0,0,0,.2);font-size:10px;cursor:default;
  user-select:none;
}
#ticker-inner{
  display:inline-block;white-space:nowrap;padding:0 16px;
  animation:ticker-scroll 40s linear infinite;
}
#ticker:hover #ticker-inner{animation-play-state:paused}
@keyframes ticker-scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
/* ── main layout ────────────────────────────────────── */
#main{flex:1;display:flex;gap:0;min-height:0}
#chart-wrap{flex:1;min-height:0;position:relative;background:var(--surface);
            border:1px solid var(--border);border-radius:8px;overflow:hidden}
#chart{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#tooltip{
  display:none;position:absolute;pointer-events:none;z-index:10;
  background:var(--tip-bg);border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;font-size:11px;line-height:1.55;min-width:140px
}
.tip-head{font-size:10px;color:var(--muted);margin-bottom:4px;
          border-bottom:1px solid var(--border);padding-bottom:4px}
.tip-row{display:flex;justify-content:space-between;gap:12px}
.tip-key{color:var(--muted)}
.tip-up{color:var(--up)}.tip-dn{color:var(--dn)}.tip-neu{color:var(--text)}
.tip-commit{color:#ffd700;font-size:10px;margin-top:4px;padding-top:4px;
            border-top:1px solid var(--border)}
.tip-cross{font-size:10px;margin-top:4px;padding-top:4px;
           border-top:1px solid var(--border)}
#empty{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;
       justify-content:center;gap:8px;color:var(--muted);font-size:13px}
#leaderboard{
  width:178px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;
  overflow-y:auto;min-height:0;transition:width .18s,padding .18s,border-color .18s
}
#leaderboard.sb-collapsed{width:0!important;padding:0!important;border-color:transparent!important;overflow:hidden}
#sb-edge{flex-shrink:0;width:10px;position:relative;cursor:col-resize;display:flex;align-items:center;justify-content:center}
#sb-edge::before{content:'';position:absolute;width:2px;top:10px;bottom:10px;left:4px;background:var(--border);border-radius:1px;transition:background .15s}
#sb-edge:hover::before{background:rgba(56,139,253,.55)}
#sb-toggle{position:relative;z-index:1;width:16px;height:28px;background:var(--surface);border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--muted);user-select:none;transition:color .15s,border-color .15s;line-height:1}
#sb-toggle:hover{color:var(--text);border-color:rgba(56,139,253,.55)}
.lb-title{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
          margin-bottom:8px;flex-shrink:0;padding-bottom:6px;
          border-bottom:1px solid var(--border)}
.lb-row{display:flex;align-items:center;gap:5px;padding:4px 0;cursor:pointer;
        border-bottom:1px solid rgba(48,54,61,.4);border-radius:3px}
.lb-row:last-child{border-bottom:none}
.lb-row:hover{background:rgba(255,255,255,.04)}
.lb-row.active{background:rgba(255,255,255,.08)}
.lb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.lb-file{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
         font-size:10px;color:var(--text)}
.lb-edits{font-size:9px;color:var(--muted);flex-shrink:0}
.lb-net{font-size:11px;font-weight:700;flex-shrink:0;min-width:30px;text-align:right}
footer{
  flex-shrink:0;display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  font-size:10px;color:var(--muted);padding:2px 0
}
.leg-line{display:inline-block;width:14px;height:2px;vertical-align:middle;
          margin-right:3px;border-radius:1px}
.sep{color:var(--border)}
.ctrl-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  font-family:inherit;font-size:9px;padding:2px 7px;border-radius:3px;
  cursor:pointer;letter-spacing:.04em
}
.ctrl-btn:hover{border-color:var(--muted)}
.ctrl-btn.active{border-color:#e8a838;color:#e8a838;background:rgba(232,168,56,.08)}
#export-btn:hover{border-color:#4fc3f7;color:#4fc3f7}
.kb-key{display:inline-block;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);
        border-radius:3px;padding:1px 4px;font-size:9px;color:rgba(255,255,255,0.55);font-family:inherit;line-height:1.5}
.kb-hint{font-size:9px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
#heat-tip{
  display:none;position:fixed;z-index:200;pointer-events:none;
  background:var(--tip-bg);border:1px solid var(--border);border-radius:6px;
  padding:5px 8px;font-size:10px;line-height:1.6;white-space:nowrap
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title">代码 K 线图</div>
      <div class="subtitle">每次文件编辑 = 一根蜡烛 &middot; 累计净变化如股价</div>
    </div>
    <div id="stats"></div>
  </header>

  <div id="ticker"><span id="ticker-inner">正在等待编辑&hellip;</span></div>

  <div id="main">
    <div id="chart-wrap">
      <canvas id="chart"></canvas>
      <div id="tooltip"></div>
      <div id="empty">
        <div style="font-size:28px">&#x1F4CA;</div>
        <div>等待第一次文件编辑&hellip;</div>
        <div style="font-size:11px">hooks 捕获到修改后自动出现</div>
      </div>
    </div>
    <div id="sb-edge"><div id="sb-toggle">&#8249;</div></div>
    <div id="leaderboard">
      <div class="lb-title">活跃文件排行 <span style="font-size:8px">(点击聚焦)</span></div>
      <div id="lb-body" style="flex:1;overflow-y:auto;min-height:0"></div>
      <div style="flex-shrink:0;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
        <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">时段热力 <span style="font-size:8px;opacity:.65">近14天·按小时</span></div>
        <canvas id="heat-canvas" style="width:100%;height:181px;display:block"></canvas>
      </div>
    </div>
  </div>

  <footer>
    <span>颜色区分文件类型</span>
    <span class="sep">|</span>
    <span>暗色=删除</span>
    <span class="sep">|</span>
    <span><span class="leg-line" style="background:#388bfd"></span>趋势</span>
    <span id="ma-leg" style="cursor:pointer;user-select:none" title="点击切换均线显示"><span class="leg-line" style="background:#e8a838"></span><span id="ma-leg-txt">MA</span></span>
    <button id="bb-btn" class="ctrl-btn">BB 带</button>
    <span><span style="color:var(--up)">&#9650;</span><span style="color:var(--dn)">&#9660;</span>金叉/死叉</span>
    <span><span style="color:#ffd700">&#9670;</span>commit</span>
    <button id="export-btn" class="ctrl-btn">导出 PNG</button>
    <button id="tail-btn" class="ctrl-btn active">&#8595; 追尾</button>
    <button id="replay-btn" class="ctrl-btn">&#9654; 回放</button>
    <span id="replay-ctrls" style="display:none;align-items:center;gap:4px">
      <button id="replay-pp" class="ctrl-btn">&#9646;&#9646;</button>
      <button id="replay-s1" class="ctrl-btn active">&times;1</button>
      <button id="replay-s2" class="ctrl-btn">&times;2</button>
      <button id="replay-s4" class="ctrl-btn">&times;4</button>
      <span id="replay-prog" style="font-size:10px;min-width:38px;text-align:center"></span>
      <button id="replay-stop" class="ctrl-btn">&#9632;</button>
    </span>
    <span class="kb-hint"><kbd class="kb-key">&#8592;&#8594;</kbd>导航<kbd class="kb-key">+/-</kbd>缩放<kbd class="kb-key">Space</kbd>最新<kbd class="kb-key">Home</kbd>最早<kbd class="kb-key">Esc</kbd>取消聚焦</span>
    <span style="margin-left:auto;font-size:10px;color:var(--muted)">滚轮缩放&middot;拖拽&middot;缩略图</span>
    <span id="last-update" style="color:var(--muted)"></span>
  </footer>
</div>

<script>
/* KLINE_DATA_START */
window.KLINE_DATA={"candles":[],"commits":[]};
/* KLINE_DATA_END */
</script>
<script>
(function(){
'use strict';

/* ── DOM ──────────────────────────────────────────── */
var canvas    = document.getElementById('chart');
var ctx       = canvas.getContext('2d');
var tooltip   = document.getElementById('tooltip');
var emptyEl   = document.getElementById('empty');
var statsEl   = document.getElementById('stats');
var lbBody    = document.getElementById('lb-body');
var lastUpEl  = document.getElementById('last-update');
var bbBtn     = document.getElementById('bb-btn');
var expBtn    = document.getElementById('export-btn');
var tickerEl  = document.getElementById('ticker-inner');
var data      = window.KLINE_DATA;

/* ── state ──────────────────────────────────────── */
var viewCount = 60, viewStart = 0;
var hovIdx    = -1;
var dragging  = false, miniDrag = false;
var dragX = 0, dragView = 0;
var focusFile = null;
var showBB    = false;
var kbMode    = false;           // keyboard nav active
var tailLock  = false;           // true = stay put when new candles arrive
var _crossY   = -1;
var _tickerLen = -1;  // guard: only rebuild ticker when data changes
var _heatSig   = '';  // guard: skip mini-heat re-render if data+size unchanged
var tipTimer   = null;             // debounce tooltip
var _cc2Cache=null,_cc2Key='',_patsCache=null,_patsKey=''; // render caches
var _yParams  = null;            // {yMin,yRange,chartH,MT} cached per render
var _bgCanvas=null,_bgCtx=null,_bgKey='';         // off-screen bg layer cache
var _candleCanvas=null,_candleCtx=null,_candleKey=''; // off-screen candle layer cache
var _commitHits=[],_hovCommit=null;               // commit diamond hover
var _sessionBounds=[],_hovSession=null;           // session boundary hover
var showMA=true;                                  // MA line visibility
/* animation */
var newCandleSet = new Set();    // indices of freshly arrived candles
var animStart    = 0;
var ANIM_MS      = 320;
var _animRaf     = null;
var replayMode=false,replayIdx=0,replayPaused=false;
var replayTimer=null,REPLAY_MS=[1000,600,320],replaySpeedIdx=0;

/* ── layout ─────────────────────────────────────── */
var ML=72,MR=26,MT=28;
var VOL_GAP=4,VOL_H=46,XLAB_H=18;
var MINI_GAP=8,MINI_H=38,MINI_BOT=6;
var BOTTOM=VOL_GAP+VOL_H+XLAB_H+MINI_GAP+MINI_H+MINI_BOT;
var _miniTopY=0;

/* ── RAF throttle ────────────────────────────────── */
var _raf=null;
function schedRender(){
  if(_raf) return;
  _raf=requestAnimationFrame(function(){_raf=null;render();});
}

/* ── colors ─────────────────────────────────────── */
var C={surface:'#161b22',grid:'rgba(48,54,61,.5)',border:'#30363d',
       muted:'#8b949e',lastLine:'rgba(56,139,253,.55)',up:'#3fb950',dn:'#f85149'};
var EXT={
  py:'#4fc3f7',pyw:'#4fc3f7',js:'#ffd54f',mjs:'#ffd54f',cjs:'#ffd54f',
  ts:'#80cbc4',jsx:'#ffb74d',tsx:'#4db6ac',
  css:'#ce93d8',scss:'#ba68c8',sass:'#ba68c8',less:'#9c84c8',
  html:'#ff8a65',htm:'#ff8a65',vue:'#a5d6a7',svelte:'#ff7043',
  go:'#80deea',rs:'#ef9a9a',java:'#c5e1a5',kt:'#b39ddb',
  c:'#90caf9',cpp:'#7986cb',cc:'#7986cb',h:'#9fa8da',hpp:'#9fa8da',
  cs:'#7e57c2',rb:'#ef5350',php:'#b39ddb',swift:'#ff8a65',
  sh:'#a5d6a7',bash:'#a5d6a7',zsh:'#a5d6a7',
  md:'#b0bec5',mdx:'#b0bec5',yaml:'#ffe082',yml:'#ffe082',
  toml:'#ffcc80',ini:'#ffcc80',json:'#fff59d',jsonc:'#fff59d',
  sql:'#80deea',lua:'#c5cae9',r:'#8bc34a',dart:'#80deea',
  ex:'#b39ddb',exs:'#b39ddb'
};
function extColor(f){return EXT[(f||'').split('.').pop().toLowerCase()]||'#9e9e9e';}
function barColor(f,d){
  var b=extColor(f); if(d>=0) return b;
  var r=parseInt(b.slice(1,3),16),g=parseInt(b.slice(3,5),16),bv=parseInt(b.slice(5,7),16),k=.38;
  return 'rgb('+Math.round(r*k)+','+Math.round(g*k)+','+Math.round(bv*k)+')';
}
function dimColor(c,t){
  var r,g,b,m;
  if(c[0]==='#'){r=parseInt(c.slice(1,3),16);g=parseInt(c.slice(3,5),16);b=parseInt(c.slice(5,7),16);}
  else{m=c.match(/\d+/g);r=+m[0];g=+m[1];b=+m[2];}
  var s=0.3+0.7*t;
  return 'rgb('+Math.round(r*s)+','+Math.round(g*s)+','+Math.round(b*s)+')';
}

/* ── data helpers ───────────────────────────────── */
function buildCC2(cc){
  var cum=0;
  return cc.map(function(c){
    var o=cum,d=(c.delta!=null)?c.delta:(c.close-c.open); cum+=d;
    return {n:c.n,time:c.time,file:c.file,session_id:c.session_id,delta:d,open:o,close:cum,
            high:Math.max(o,cum),low:Math.min(o,cum)};
  });
}
function buildMA(cc2,period){
  return cc2.map(function(_,i){
    if(i<period-1) return null;
    return cc2.slice(i-period+1,i+1).reduce(function(s,v){return s+v.close;},0)/period;
  });
}
function calcBB(cc2,period){
  return cc2.map(function(_,i){
    if(i<period-1) return null;
    var sl=cc2.slice(i-period+1,i+1);
    var mn=sl.reduce(function(s,v){return s+v.close;},0)/period;
    var vr=sl.reduce(function(s,v){return s+Math.pow(v.close-mn,2);},0)/period;
    return {upper:mn+2*Math.sqrt(vr),lower:mn-2*Math.sqrt(vr)};
  });
}
function calcStreak(cc){
  if(cc.length<2) return null;
  var dir=0,count=0;
  for(var i=cc.length-1;i>=0;i--){
    var d=(cc[i].delta!=null)?cc[i].delta:(cc[i].close-cc[i].open);
    if(d===0) continue;
    var s=d>0?1:-1;
    if(dir===0){dir=s;count=1;}
    else if(s===dir){count++;}
    else break;
  }
  return count>=2?{count:count,dir:dir}:null;
}
function computeRuns(vis){
  var runs=[];
  if(!vis.length) return runs;
  var cur=vis[0].session_id||'',s=0,ri=0;
  for(var i=1;i<=vis.length;i++){
    var sid=i<vis.length?(vis[i].session_id||''):'';
    if(i===vis.length||sid!==cur){
      runs.push({start:s,end:i-1,runIdx:ri,sid:cur});
      s=i; ri++; cur=sid;
    }
  }
  return runs;
}
function detectPatterns(vis){
  var out={};
  for(var i=0;i<vis.length;i++){
    var c=vis[i],d=c.delta,pats=[];
    if(d===0) pats.push({label:'十',color:'#8b949e',up:true});
    if(i>0){
      var pd=vis[i-1].delta;
      if(pd<0&&d>0&&d>Math.abs(pd)*1.1)
        pats.push({label:'↑↑',color:'#3fb950',up:true});
      else if(pd>0&&d<0&&Math.abs(d)>pd*1.1)
        pats.push({label:'↓↓',color:'#f85149',up:false});
    }
    if(pats.length) out[i]=pats;
  }
  return out;
}
function getCachedCC2(){
  var cc=getCandles(),k=cc.length+'|'+(replayMode?replayIdx:-1);
  if(k!==_cc2Key){_cc2Cache=buildCC2(cc);_cc2Key=k;}
  return _cc2Cache;
}
function getCachedPatterns(vis){
  var k=vis.length>0?(vis[0].n||0)+'-'+(vis[vis.length-1].n||0)+'-'+vis.length:'0';
  if(k!==_patsKey){_patsCache=detectPatterns(vis);_patsKey=k;}
  return _patsCache;
}
function screenToVal(y){
  if(!_yParams) return 0;
  return _yParams.yMin+_yParams.yRange*(1-(y-_yParams.MT)/_yParams.chartH);
}
function easeOut(t){return 1-Math.pow(1-t,3);}
function getCandles(){
  return replayMode?(data.candles||[]).slice(0,replayIdx):(data.candles||[]);
}
function niceTicks(mn,mx){
  var n=6,range=mx-mn||1,rough=range/n;
  var mag=Math.pow(10,Math.floor(Math.log10(rough)));
  var step=[1,2,5,10].map(function(m){return m*mag;}).find(function(s){return s>=rough;})||mag*10;
  var ticks=[],start=Math.ceil(mn/step)*step;
  for(var t=start;t<=mx+1e-9;t=Math.round((t+step)*1e9)/1e9) ticks.push(t);
  return ticks;
}
function fmtK(n){
  var a=Math.abs(n);
  if(a>=1000) return (n/1000).toFixed(a>=10000?1:2).replace(/\.?0+$/,'')+'k';
  return n.toString();
}
function fmtTime(iso){
  if(!iso) return '';
  try{
    var d=new Date(iso);
    return (d.getMonth()+1).toString().padStart(2,'0')+'-'+
           d.getDate().toString().padStart(2,'0')+' '+
           d.getHours().toString().padStart(2,'0')+':'+
           d.getMinutes().toString().padStart(2,'0');
  }catch(e){return iso.slice(0,16);}
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function initView(){viewStart=Math.max(0,(data.candles||[]).length-viewCount);}

/* ── RENDER ─────────────────────────────────────── */
function render(){
  var cc=getCandles();
  var allCC2=getCachedCC2();
  viewStart=Math.max(0,Math.min(viewStart,Math.max(0,cc.length-1)));
  var vis=allCC2.slice(viewStart,viewStart+viewCount);

  var wrap=canvas.parentElement;
  var dpr=window.devicePixelRatio||1;
  var W=wrap.clientWidth,H=wrap.clientHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.scale(dpr,dpr);
  emptyEl.style.display=cc.length===0?'flex':'none';
  if(!cc.length){ctx.fillStyle=C.surface;ctx.fillRect(0,0,W,H);renderStats(cc);renderLeaderboard(cc);renderMiniHeat(data.candles||[]);return;}

  var chartH=H-MT-BOTTOM, volTop=MT+chartH+VOL_GAP;
  var xlabY=volTop+VOL_H+XLAB_H-4, miniTop=H-MINI_BOT-MINI_H;
  _miniTopY=miniTop;

  var chartW=W-ML-MR, slotW=chartW/viewCount;
  var allP=[]; vis.forEach(function(c){allP.push(c.open,c.close);});
  var pMin=Math.min.apply(null,[0].concat(allP));
  var pMax=Math.max.apply(null,[0].concat(allP));
  var pad=(pMax-pMin)*.14||8;
  var yMin=pMin-pad,yMax=pMax+pad,yRange=yMax-yMin;
  _yParams={yMin:yMin,yRange:yRange,chartH:chartH,MT:MT};
  function toX(i){return ML+(i+.5)*slotW;}
  function toY(p){return MT+chartH*(1-(p-yMin)/yRange);}

  /* MA & crossings */
  var maLen=Math.min(7,Math.max(3,Math.ceil(cc.length/4)));
  var _maLegEl=document.getElementById('ma-leg-txt');if(_maLegEl)_maLegEl.textContent='MA'+maLen;
  var maArr=buildMA(allCC2,maLen);
  var crossings={};
  for(var ci=1;ci<vis.length;ci++){
    var ai=viewStart+ci,aip=ai-1;
    if(maArr[ai]===null||maArr[aip]===null) continue;
    var pc=vis[ci-1].close,cc2c=vis[ci].close,pm=maArr[aip],cm=maArr[ai];
    if(pc<=pm&&cc2c>cm) crossings[ci]='golden';
    else if(pc>=pm&&cc2c<cm) crossings[ci]='death';
  }

  /* anim progress */
  var animProg=newCandleSet.size>0?easeOut(Math.min(1,(Date.now()-animStart)/ANIM_MS)):1;

  /* ── bg canvas: grid + zero baseline + session bands ── */
  var bgKey=W+'|'+H+'|'+dpr+'|'+viewStart+'|'+viewCount+'|'+cc.length;
  if(bgKey!==_bgKey){
    if(!_bgCanvas||_bgCanvas.width!==W*dpr||_bgCanvas.height!==H*dpr){
      _bgCanvas=document.createElement('canvas');
      _bgCanvas.width=W*dpr; _bgCanvas.height=H*dpr;
      _bgCtx=_bgCanvas.getContext('2d'); _bgCtx.scale(dpr,dpr);
    }
    var bc=_bgCtx; bc.clearRect(0,0,W,H);
    bc.fillStyle=C.surface; bc.fillRect(0,0,W,H);
    bc.strokeStyle=C.grid; bc.lineWidth=1;
    niceTicks(yMin,yMax).forEach(function(t){
      if(t<yMin||t>yMax) return;
      var y=Math.round(toY(t))+.5;
      bc.beginPath(); bc.moveTo(ML,y); bc.lineTo(W-MR,y); bc.stroke();
      bc.fillStyle=C.muted; bc.font='10px monospace'; bc.textAlign='right';
      bc.fillText(fmtK(t),ML-6,y+3.5);
    });
    if(0>=yMin&&0<=yMax){
      var zy=Math.round(toY(0))+.5;
      bc.setLineDash([2,3]); bc.strokeStyle='rgba(255,255,255,.18)'; bc.lineWidth=1;
      bc.beginPath(); bc.moveTo(ML,zy); bc.lineTo(W-MR,zy); bc.stroke();
      bc.setLineDash([]);
      bc.fillStyle='rgba(255,255,255,.35)'; bc.font='9px monospace'; bc.textAlign='right';
      bc.fillText('0',ML-6,zy+3.5);
    }
    var bgRuns=computeRuns(vis);
    bgRuns.forEach(function(run){
      var rx=Math.floor(ML+run.start*slotW);
      var rw=Math.max(1,Math.floor(ML+(run.end+1)*slotW)-rx);
      bc.fillStyle=run.runIdx%2===1?'rgba(255,255,255,0.04)':'rgba(0,0,0,0)';
      bc.fillRect(rx,MT,rw,chartH);
    });
    bgRuns.forEach(function(run){
      if(run.runIdx===0) return;
      var bx=Math.floor(ML+run.start*slotW)+.5;
      bc.save();
      bc.strokeStyle='rgba(139,148,158,0.2)'; bc.lineWidth=1; bc.setLineDash([3,3]);
      bc.beginPath(); bc.moveTo(bx,MT); bc.lineTo(bx,MT+chartH); bc.stroke();
      bc.setLineDash([]); bc.restore();
      if(run.sid&&run.end-run.start>=2){
        bc.fillStyle='rgba(139,148,158,0.4)'; bc.font='7px monospace'; bc.textAlign='left';
        bc.fillText(run.sid.slice(0,4),bx+3,MT+9);
      }
    });
    _bgKey=bgKey;
    /* populate session boundary hit areas (positions are stable for this bgKey) */
    _sessionBounds=[];
    bgRuns.forEach(function(run,ri){
      if(run.runIdx===0) return;
      var bx=Math.floor(ML+run.start*slotW)+.5;
      var netD=0,sc=0;
      for(var si=run.start;si<=run.end;si++){netD+=(vis[si].delta||0);sc++;}
      _sessionBounds.push({x:bx,sid:run.sid,count:sc,netDelta:netD,
        startTime:vis[run.start]?vis[run.start].time:'',
        endTime:vis[run.end]?vis[run.end].time:''});
    });
  }
  ctx.drawImage(_bgCanvas,0,0,W,H);
  /* ── candle layer cache setup ───────────────── */
  var candleKey=bgKey+'|'+(showBB?1:0)+'|'+(showMA?1:0)+'|'+(focusFile||'');
  var useCL=(animProg>=1);
  var buildCL=(useCL&&candleKey!==_candleKey);
  var mainCtx=ctx,savedHovIdx=hovIdx;
  if(useCL&&!buildCL){
    /* cache hit: draw hover then blit */
    if(hovIdx>=0&&hovIdx<vis.length){
      var lhx=Math.floor(ML+hovIdx*slotW),lhw=Math.floor(ML+(hovIdx+1)*slotW)-lhx;
      ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(lhx,MT,lhw,chartH+VOL_GAP+VOL_H);
      ctx.fillStyle='rgba(56,139,253,0.45)';ctx.fillRect(lhx,MT,lhw,2);
    }
    ctx.drawImage(_candleCanvas,0,0,W,H);
  }
  if(!useCL||buildCL){
    if(buildCL){
      if(!_candleCanvas||_candleCanvas.width!==W*dpr||_candleCanvas.height!==H*dpr){
        _candleCanvas=document.createElement('canvas');
        _candleCanvas.width=W*dpr;_candleCanvas.height=H*dpr;
        _candleCtx=_candleCanvas.getContext('2d');_candleCtx.scale(dpr,dpr);
      }
      _candleCtx.clearRect(0,0,W,H);
      ctx=_candleCtx;hovIdx=-1; /* redirect drawing + suppress hover highlight */
    }
  /* ── last-close line ───────────────────────────── */

  if(vis.length>0){
    var lv=vis[vis.length-1].close,ly=Math.round(toY(lv))+.5;
    ctx.setLineDash([4,4]); ctx.strokeStyle=C.lastLine; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(ML,ly); ctx.lineTo(W-MR,ly); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=C.lastLine; ctx.font='bold 10px monospace'; ctx.textAlign='left';
    ctx.fillText(lv.toLocaleString(),W-MR+3,ly+3.5);
  }

  /* ── Bollinger Bands ───────────────────────────── */
  if(showBB&&cc.length>=5){
    var bbPer=Math.min(20,Math.max(5,Math.floor(cc.length/3)));
    var bbData=calcBB(allCC2,bbPer);
    ctx.save();
    ctx.beginPath(); var bbs=false;
    vis.forEach(function(_,i){
      var ai2=viewStart+i; if(!bbData[ai2]) return;
      var x=toX(i),y=toY(bbData[ai2].upper);
      bbs?(ctx.lineTo(x,y)):(ctx.moveTo(x,y),bbs=true);
    });
    for(var ri=Math.min(vis.length-1,viewCount-1);ri>=0;ri--){
      var rai=viewStart+ri; if(!bbData[rai]) continue;
      ctx.lineTo(toX(ri),toY(bbData[rai].lower));
    }
    ctx.closePath(); ctx.fillStyle='rgba(232,168,56,.07)'; ctx.fill();
    ctx.strokeStyle='rgba(232,168,56,.35)'; ctx.lineWidth=1; ctx.lineJoin='round';
    ctx.setLineDash([3,3]);
    ['upper','lower'].forEach(function(k){
      ctx.beginPath(); bbs=false;
      vis.forEach(function(_,i){
        var ai2=viewStart+i; if(!bbData[ai2]) return;
        var x=toX(i),y=toY(bbData[ai2][k]);
        bbs?(ctx.lineTo(x,y)):(ctx.moveTo(x,y),bbs=true);
      });
      ctx.stroke();
    });
    ctx.setLineDash([]); ctx.restore();
  }

  /* ── time gap markers ──────────────────────────── */
  var GAP_THRESH=30*60*1000;
  for(var gi=1;gi<vis.length;gi++){
    var gdt=new Date(vis[gi].time)-new Date(vis[gi-1].time);
    if(gdt<GAP_THRESH) continue;
    var gx=Math.floor(ML+gi*slotW)+.5;
    var gm=Math.round(gdt/60000),gl=gm>=1440?Math.round(gm/1440)+'d':gm>=60?Math.round(gm/60)+'h':gm+'m';
    ctx.save();
    /* amber dashed line — visually distinct from gray session-boundary lines */
    ctx.strokeStyle='rgba(255,190,60,0.25)'; ctx.lineWidth=1; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(gx,MT); ctx.lineTo(gx,MT+chartH); ctx.stroke();
    ctx.setLineDash([]);
    /* duration badge sits inside the chart body, well clear of X-axis labels */
    ctx.font='8px monospace';
    var _tw=ctx.measureText(gl).width,_pw=_tw+8,_ph=12;
    var _px=gx-_pw/2,_py=MT+chartH-_ph-3;
    ctx.fillStyle='rgba(30,24,8,0.78)';
    ctx.fillRect(_px,_py,_pw,_ph);
    ctx.strokeStyle='rgba(255,190,60,0.45)'; ctx.lineWidth=0.8;
    ctx.strokeRect(_px+0.5,_py+0.5,_pw-1,_ph-1);
    ctx.fillStyle='rgba(255,190,60,0.9)'; ctx.textAlign='center';
    ctx.fillText(gl,gx,_py+_ph-3);
  }

  /* ── candle bars (with animation for new candles) ── */
  var maxAbsDelta=vis.reduce(function(m,c){return Math.max(m,Math.abs(c.delta));},1);
  var lstep=vis.length<=20?1:Math.ceil(vis.length/16);
  vis.forEach(function(c,i){
    var d=(c.delta!=null)?c.delta:(c.close-c.open);
    var col=barColor(c.file||'',d);
    col=dimColor(col,0.3+0.7*Math.abs(d)/maxAbsDelta);
    var matched=!focusFile||c.file===focusFile;
    var absIdx=viewStart+i;
    var isNew=newCandleSet.has(absIdx);
    var ap=isNew?animProg:1;

    var lx=Math.floor(ML+i*slotW),bw=Math.floor(ML+(i+1)*slotW)-lx;
    var cx=lx+bw/2,barW=Math.min(bw-2,16),ox=Math.round(cx-barW/2);
    /* animate: bar grows from open toward close */
    var rawOy=toY(c.open),rawCy=toY(c.close);
    var animCy=rawOy+(rawCy-rawOy)*ap;
    var top=Math.min(rawOy,animCy),ht=Math.max(2,Math.abs(animCy-rawOy));

    if(i===hovIdx){
      ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fillRect(lx,MT,bw,chartH+VOL_GAP+VOL_H);
      ctx.fillStyle='rgba(56,139,253,0.45)';  ctx.fillRect(lx,MT,bw,2);
    }

    ctx.globalAlpha=(matched?1.0:.12)*ap;
    if(d===0){
      ctx.strokeStyle=col; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(ox,Math.round(rawOy)); ctx.lineTo(ox+barW,Math.round(rawOy)); ctx.stroke();
    } else {
      ctx.fillStyle=col; ctx.fillRect(ox,Math.round(top),barW,Math.round(ht));
    }
    ctx.globalAlpha=1.0;

    if(i%lstep===0){
      var lt=new Date(c.time),prevVis2=i>0?vis[i-1]:null;
      var isNewDay=!prevVis2||new Date(prevVis2.time).toDateString()!==lt.toDateString();
      ctx.textAlign='center';
      if(isNewDay){
        ctx.fillStyle='rgba(139,148,158,0.9)'; ctx.font='bold 9px monospace';
        ctx.fillText((lt.getMonth()+1)+'/'+(lt.getDate()),cx,xlabY);
      } else {
        ctx.fillStyle=C.muted; ctx.font='9px monospace';
        ctx.fillText(lt.getHours().toString().padStart(2,'0')+':'+lt.getMinutes().toString().padStart(2,'0'),cx,xlabY);
      }
    }
  });

  /* ── close price line + area ────────────────────── */
  if(vis.length>1){
    ctx.save();
    var zeroY=Math.max(MT,Math.min(MT+chartH,toY(0)));
    ctx.beginPath();
    vis.forEach(function(c,i){var x=toX(i),y=toY(c.close);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.lineTo(toX(vis.length-1),zeroY); ctx.lineTo(toX(0),zeroY); ctx.closePath();
    var grad=ctx.createLinearGradient(0,MT,0,MT+chartH);
    grad.addColorStop(0,'rgba(56,139,253,.14)'); grad.addColorStop(1,'rgba(56,139,253,0)');
    ctx.fillStyle=grad; ctx.fill();
    ctx.beginPath(); ctx.strokeStyle='rgba(56,139,253,.75)'; ctx.lineWidth=1.5; ctx.lineJoin='round';
    vis.forEach(function(c,i){var x=toX(i),y=toY(c.close);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.stroke(); ctx.restore();
  }

  /* ── MA line ─────────────────────────────────────── */
  if(showMA&&cc.length>=maLen){
    ctx.save(); ctx.strokeStyle='#e8a838'; ctx.lineWidth=1.5; ctx.lineJoin='round';
    ctx.beginPath(); var maS=false;
    vis.forEach(function(_,i){
      var ai2=viewStart+i; if(maArr[ai2]===null) return;
      var x=toX(i),y=toY(maArr[ai2]);
      maS?ctx.lineTo(x,y):(ctx.moveTo(x,y),maS=true);
    });
    ctx.stroke(); ctx.restore();
  }

  /* ── golden / death cross markers ───────────────── */
  Object.keys(crossings).forEach(function(iStr){
    var i=parseInt(iStr,10),type=crossings[i];
    var isGolden=type==='golden',col=isGolden?C.up:C.dn;
    var x=toX(i),y=isGolden?toY(vis[i].close)-12:toY(vis[i].close)+12;
    ctx.fillStyle=col;
    ctx.beginPath();
    if(isGolden){ctx.moveTo(x,y-5);ctx.lineTo(x+5,y+5);ctx.lineTo(x-5,y+5);}
    else{ctx.moveTo(x,y+5);ctx.lineTo(x+5,y-5);ctx.lineTo(x-5,y-5);}
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=col; ctx.font='bold 8px monospace'; ctx.textAlign='center';
    ctx.fillText(isGolden?'G':'D',x,isGolden?y-8:y+14);
  });

  /* ── commit markers ──────────────────────────────── */
  _commitHits=[];
  (data.commits||[]).forEach(function(cm){
    var vi=-1; vis.forEach(function(c,i){if(c.n===cm.after_candle_n) vi=i;});
    if(vi<0) return;
    var x=toX(vi),y=MT+10,isHov=(!buildCL&&_hovCommit===cm);
    ctx.save();
    if(isHov){ctx.shadowColor='rgba(255,215,0,0.7)';ctx.shadowBlur=8;}
    ctx.fillStyle=isHov?'#ffe066':'#ffd700';
    ctx.beginPath(); ctx.moveTo(x,y-6); ctx.lineTo(x+5,y); ctx.lineTo(x,y+6); ctx.lineTo(x-5,y);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    _commitHits.push({x:x,y:y,cm:cm});
  });

  /* ── axes ────────────────────────────────────────── */
  /* ── candle pattern labels ──────────────────────────── */
  var pats=getCachedPatterns(vis);
  Object.keys(pats).forEach(function(iStr){
    var i=parseInt(iStr,10),plist=pats[i],cv=vis[i];
    var cx=toX(i);
    plist.forEach(function(pt,pi){
      var topY=Math.min(toY(cv.open),toY(cv.close));
      var botY=Math.max(toY(cv.open),toY(cv.close));
      var ly=pt.up?(topY-7-pi*10):(botY+9+pi*10);
      ly=Math.max(MT+6,Math.min(MT+chartH-4,ly));
      ctx.fillStyle=pt.color; ctx.font='bold 8px monospace'; ctx.textAlign='center';
      ctx.fillText(pt.label,cx,ly);
    });
  });

  ctx.strokeStyle=C.border; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(ML,MT); ctx.lineTo(ML,MT+chartH);
  ctx.moveTo(ML,MT+chartH); ctx.lineTo(W-MR,MT+chartH);
  ctx.stroke();

  /* ── volume bars ─────────────────────────────────── */
  ctx.strokeStyle='rgba(48,54,61,.6)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(ML,volTop); ctx.lineTo(W-MR,volTop); ctx.stroke();
  var maxVol=0;
  vis.forEach(function(c){var v=Math.abs((c.delta!=null)?c.delta:(c.close-c.open));if(v>maxVol)maxVol=v;});
  if(maxVol>0){
    vis.forEach(function(c,i){
      var d=(c.delta!=null)?c.delta:(c.close-c.open),vol=Math.abs(d);
      var col=barColor(c.file||'',d),matched=!focusFile||c.file===focusFile;
      var absIdx=viewStart+i,isNew=newCandleSet.has(absIdx),ap=isNew?animProg:1;
      var lx=Math.floor(ML+i*slotW),bw=Math.floor(ML+(i+1)*slotW)-lx;
      var barW=Math.min(bw-2,14),cx=lx+bw/2,ox=Math.round(cx-barW/2);
      var bh=Math.round((vol/maxVol)*(VOL_H-3)*ap);
      ctx.globalAlpha=matched?.8:.1;
      ctx.fillStyle=col; ctx.fillRect(ox,volTop+VOL_H-bh,barW,bh);
      ctx.globalAlpha=1.0;
    });
    ctx.fillStyle=C.muted; ctx.font='8px monospace'; ctx.textAlign='left';
    ctx.fillText('VOL',ML+2,volTop+9);
  }

    if(buildCL){
      ctx=mainCtx;hovIdx=savedHovIdx;_candleKey=candleKey;
      if(hovIdx>=0&&hovIdx<vis.length){
        var lhx2=Math.floor(ML+hovIdx*slotW),lhw2=Math.floor(ML+(hovIdx+1)*slotW)-lhx2;
        ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(lhx2,MT,lhw2,chartH+VOL_GAP+VOL_H);
        ctx.fillStyle='rgba(56,139,253,0.45)';ctx.fillRect(lhx2,MT,lhw2,2);
      }
      ctx.drawImage(_candleCanvas,0,0,W,H);
    }
  } /* end candle layer */
  /* commit hover glow drawn on main canvas (not baked into candle cache) */
  if(_hovCommit&&useCL){
    (data.commits||[]).forEach(function(hcm){
      if(hcm!==_hovCommit) return;
      var hvi=-1;vis.forEach(function(c,i){if(c.n===hcm.after_candle_n)hvi=i;});
      if(hvi<0) return;
      var hx=toX(hvi),hy_=MT+10;
      ctx.save();ctx.shadowColor='rgba(255,215,0,0.7)';ctx.shadowBlur=8;
      ctx.fillStyle='#ffe066';
      ctx.beginPath();ctx.moveTo(hx,hy_-6);ctx.lineTo(hx+5,hy_);ctx.lineTo(hx,hy_+6);ctx.lineTo(hx-5,hy_);
      ctx.closePath();ctx.fill();ctx.restore();
    });
  }

  /* ── minimap ─────────────────────────────────────── */
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(ML,miniTop,chartW,MINI_H);
  ctx.strokeStyle=C.border; ctx.lineWidth=1;
  ctx.strokeRect(ML+.5,miniTop+.5,chartW-1,MINI_H-1);
  if(allCC2.length>0){
    var ap2=[]; allCC2.forEach(function(c){ap2.push(c.open,c.close);});
    var mpMin=Math.min.apply(null,[0].concat(ap2)),mpMax=Math.max.apply(null,[0].concat(ap2));
    var mpad=(mpMax-mpMin)*.1||4,myMin=mpMin-mpad,myMax=mpMax+mpad,myRange=myMax-myMin;
    var mSlW=chartW/Math.max(allCC2.length,1);
    function mToY(p){return miniTop+MINI_H*(1-(p-myMin)/myRange);}
    allCC2.forEach(function(c,i){
      var d=(c.delta!=null)?c.delta:(c.close-c.open),col=barColor(c.file||'',d);
      var matched=!focusFile||c.file===focusFile;
      var lx=Math.floor(ML+i*mSlW),bw=Math.max(1,Math.floor(ML+(i+1)*mSlW)-lx);
      var oy=mToY(c.open),cy2=mToY(c.close),top=Math.min(oy,cy2),ht=Math.max(1,Math.abs(cy2-oy));
      ctx.globalAlpha=matched?.9:.2;
      ctx.fillStyle=col; ctx.fillRect(lx,Math.round(top),bw,Math.round(ht));
    });
    ctx.globalAlpha=1.0;
    var totalN=Math.max(allCC2.length,1);
    var wL=Math.floor(ML+(viewStart/totalN)*chartW);
    var wR=Math.floor(ML+(Math.min(viewStart+viewCount,totalN)/totalN)*chartW);
    wL=Math.max(ML,wL); wR=Math.min(ML+chartW,Math.max(wL+4,wR));
    ctx.fillStyle='rgba(255,255,255,.1)'; ctx.fillRect(wL,miniTop,wR-wL,MINI_H);
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1;
    ctx.strokeRect(wL+.5,miniTop+.5,wR-wL-1,MINI_H-1);
    /* replay progress marker */
    if(replayMode&&replayIdx>0){
      var rpx=Math.floor(ML+(replayIdx/totalN)*chartW);
      rpx=Math.max(ML,Math.min(ML+chartW-1,rpx));
      ctx.save();
      ctx.strokeStyle='rgba(255,190,60,0.85)';ctx.lineWidth=1.5;
      ctx.setLineDash([2,2]);
      ctx.beginPath();ctx.moveTo(rpx+.5,miniTop);ctx.lineTo(rpx+.5,miniTop+MINI_H);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(255,190,60,0.9)';ctx.font='bold 7px monospace';ctx.textAlign='center';
      ctx.fillText(replayIdx,rpx,miniTop+MINI_H-2);
      ctx.restore();
    }
  }

  /* ── crosshair (drawn last) ──────────────────────── */
  /* always snap crosshair to candle close price */
  if(hovIdx>=0&&hovIdx<vis.length){
    _crossY=toY(vis[hovIdx].close);
  }
  if(hovIdx>=0&&hovIdx<vis.length&&_crossY>=MT&&_crossY<=MT+chartH){
    ctx.save();
    ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1;
    var vx=toX(hovIdx)+.5;
    ctx.beginPath(); ctx.moveTo(vx,MT); ctx.lineTo(vx,MT+chartH); ctx.stroke();
    var hy=Math.round(_crossY)+.5;
    ctx.beginPath(); ctx.moveTo(ML,hy); ctx.lineTo(W-MR,hy); ctx.stroke();
    ctx.setLineDash([]);
    /* Y value box */
    var val=Math.round(screenToVal(_crossY)),vstr=fmtK(val);
    var bw2=ML-6,bh2=16,bx2=2,by2=Math.round(_crossY)-bh2/2;
    by2=Math.max(MT,Math.min(MT+chartH-bh2,by2));
    ctx.fillStyle='rgba(56,139,253,.9)';
    roundRect(bx2,by2,bw2,bh2,3); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 9px monospace'; ctx.textAlign='center';
    ctx.fillText(vstr,bx2+bw2/2,by2+bh2*.72);
    /* X candle label box */
    var hc=vis[hovIdx];
    if(hc){
      var nstr='#'+(hc.n!=null?hc.n:(viewStart+hovIdx+1));
      ctx.font='bold 9px monospace';
      var nbw=ctx.measureText(nstr).width+10,nbx=vx-nbw/2-.5,nby=xlabY-12;
      ctx.fillStyle='rgba(56,139,253,.85)';
      roundRect(nbx,nby,nbw,14,3); ctx.fill();
      ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText(nstr,vx,nby+10);
    }
    ctx.restore();
    /* show tooltip in kbMode */
    if(kbMode&&vis[hovIdx]){
      showTip(vis[hovIdx],Math.min(toX(hovIdx)+16,W-160),
              Math.max(MT+20,Math.min(_crossY-40,H-120)),W,H);
    }
  }

  renderStats(cc); renderLeaderboard(cc); renderMiniHeat(data.candles||[]);
}

/* ── animation loop ─────────────────────────────── */
/* ── heatmap ─────────────────────────────────── */
function heatColor(count,maxCount){
  if(count===0||maxCount===0) return 'rgba(255,255,255,0.04)';
  var t=Math.min(1,count/maxCount);
  var h=(40+10*t).toFixed(0),s=(80+15*t).toFixed(0),l=(35+30*t).toFixed(0),a=(0.3+0.7*t).toFixed(2);
  return 'hsla('+h+','+s+'%,'+l+'%,'+a+')';
}
function renderHeatmap(W,H){
  var cc=data.candles||[];
  if(!cc.length){
    ctx.fillStyle=C.muted;ctx.font='13px monospace';ctx.textAlign='center';
    ctx.fillText('暂无数据',W/2,H/2);return;
  }
  var grid={},dates=[];
  cc.forEach(function(c){
    var d=new Date(c.time);
    var ds=(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
    var h=d.getHours();
    if(!grid[ds]){grid[ds]=new Array(24).fill(0);dates.push(ds);}
    grid[ds][h]++;
  });
  dates.sort();
  var maxCount=0;
  dates.forEach(function(ds){grid[ds].forEach(function(v){if(v>maxCount)maxCount=v;});});
  var HML=34,HMR=14,HMT=44,HMB=36;
  var gridW=W-HML-HMR,gridH=H-HMT-HMB;
  var cols=dates.length,cellW=gridW/Math.max(cols,1),cellH=gridH/24;
  /* title */
  ctx.fillStyle='#e6edf3';ctx.font='bold 12px monospace';ctx.textAlign='center';
  ctx.fillText('编辑时段热力图',W/2,20);
  ctx.fillStyle=C.muted;ctx.font='9px monospace';
  ctx.fillText('行=小时  列=日期  颜色越亮=编辑越多',W/2,32);
  /* cells */
  for(var di=0;di<cols;di++){
    var ds=dates[di];
    for(var h=0;h<24;h++){
      var cnt=grid[ds][h];
      var cx=HML+di*cellW,cy=HMT+h*cellH;
      ctx.fillStyle=heatColor(cnt,maxCount);
      ctx.fillRect(cx+0.5,cy+0.5,Math.max(1,cellW-1.5),Math.max(1,cellH-1.5));
      if(cnt>0&&cellW>24&&cellH>12){
        ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='7px monospace';ctx.textAlign='center';
        ctx.fillText(cnt,cx+cellW/2,cy+cellH*0.65);
      }
    }
  }
  /* hour labels every 2h */
  ctx.fillStyle=C.muted;ctx.font='9px monospace';ctx.textAlign='right';
  for(var h2=0;h2<24;h2+=2){
    ctx.fillText(h2.toString().padStart(2,'0')+':00',HML-3,HMT+h2*cellH+cellH*0.7);
  }
  /* date labels rotated */
  ctx.fillStyle=C.muted;ctx.font='9px monospace';
  for(var di2=0;di2<cols;di2++){
    var lx2=HML+(di2+0.5)*cellW,ly2=H-HMB+18;
    ctx.save();ctx.translate(lx2,ly2);ctx.rotate(-Math.PI/3.5);
    ctx.textAlign='right';ctx.fillText(dates[di2],0,0);ctx.restore();
  }
  /* color legend */
  var legX=W-HMR-80,legY=14;
  for(var li=0;li<80;li++){ctx.fillStyle=heatColor(li,79);ctx.fillRect(legX+li,legY,1,6);}
  ctx.fillStyle=C.muted;ctx.font='8px monospace';
  ctx.textAlign='left';ctx.fillText('少',legX,legY-1);
  ctx.textAlign='right';ctx.fillText('多',legX+80,legY-1);
  ctx.strokeStyle=C.border;ctx.lineWidth=1;
  ctx.strokeRect(HML+0.5,HMT+0.5,gridW-1,gridH-1);
}

/* ── mini heat (sidebar) ─────────────────────── */
function ghGreen(count,maxCount){
  if(count===0||maxCount===0) return 'rgba(255,255,255,0.07)';
  var t=Math.min(1,count/maxCount);
  return 'rgb('+Math.round(14+43*t)+','+Math.round(68+143*t)+','+Math.round(41+42*t)+')';
}
function renderMiniHeat(cc){
  var hc=document.getElementById('heat-canvas');
  if(!hc) return;
  var W=hc.offsetWidth;
  if(!W) return;
  var DAYS=14,GAP=1,ML=16,MR=2,MT=2,MB=12;
  var lb=document.getElementById('leaderboard');
  var lbH=lb?lb.offsetHeight:9999;
  var maxCS=Math.max(5,Math.floor((lbH*0.5-(MT+MB+(24-1)*GAP))/24));
  var CS=Math.max(5,Math.min(maxCS,Math.floor((W-ML-MR-(DAYS-1)*GAP)/DAYS)));
  var gridW=DAYS*(CS+GAP)-GAP,gridH=24*(CS+GAP)-GAP;
  var H=MT+gridH+MB;
  hc.style.height=H+'px';
  var sig=cc.length+'|'+W+'|'+lbH;
  if(sig===_heatSig) return;
  _heatSig=sig;
  var dpr=window.devicePixelRatio||1;
  hc.width=W*dpr; hc.height=H*dpr;
  var hx=hc.getContext('2d');
  hx.scale(dpr,dpr);
  hx.clearRect(0,0,W,H);
  /* last DAYS days */
  var today=new Date(); today.setHours(0,0,0,0);
  var days=[],dayNums=[];
  for(var di=DAYS-1;di>=0;di--){
    var dt=new Date(today); dt.setDate(dt.getDate()-di);
    days.push((dt.getMonth()+1).toString().padStart(2,'0')+'-'+dt.getDate().toString().padStart(2,'0'));
    dayNums.push(dt.getDate().toString());
  }
  var grid={};
  days.forEach(function(ds){grid[ds]=new Array(24).fill(0);});
  cc.forEach(function(c){
    var d=new Date(c.time);
    var ds=(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
    if(grid[ds]) grid[ds][d.getHours()]++;
  });
  var maxCount=0;
  days.forEach(function(ds){grid[ds].forEach(function(v){if(v>maxCount)maxCount=v;});});
  /* center grid in available width */
  var startX=ML+Math.floor(Math.max(0,W-ML-MR-gridW)/2);
  var rr=1.5;
  for(var ci=0;ci<DAYS;ci++){
    for(var h=0;h<24;h++){
      var cnt=grid[days[ci]][h];
      var x=startX+ci*(CS+GAP),y=MT+h*(CS+GAP);
      hx.fillStyle=ghGreen(cnt,maxCount);
      hx.beginPath();
      hx.moveTo(x+rr,y);hx.lineTo(x+CS-rr,y);hx.arcTo(x+CS,y,x+CS,y+rr,rr);
      hx.lineTo(x+CS,y+CS-rr);hx.arcTo(x+CS,y+CS,x+CS-rr,y+CS,rr);
      hx.lineTo(x+rr,y+CS);hx.arcTo(x,y+CS,x,y+CS-rr,rr);
      hx.lineTo(x,y+rr);hx.arcTo(x,y,x+rr,y,rr);
      hx.closePath();hx.fill();
    }
  }
  /* today column highlight (last column = today) */
  var todayX=startX+(DAYS-1)*(CS+GAP);
  hx.save();
  hx.strokeStyle='rgba(56,139,253,0.55)';hx.lineWidth=1.5;
  hx.strokeRect(todayX-1,MT-1,CS+2,gridH+2);
  hx.restore();
  hx.fillStyle='rgba(56,139,253,0.6)';hx.font='bold 7px monospace';hx.textAlign='center';
  hx.fillText('今',todayX+CS/2,MT-2);
  /* hour labels: 00 06 12 18 */
  hx.fillStyle='rgba(139,148,158,0.65)';hx.font='6px monospace';hx.textAlign='right';
  [0,6,12,18].forEach(function(h){
    hx.fillText(h.toString().padStart(2,'0'),startX-2,MT+h*(CS+GAP)+CS*0.85);
  });
  /* day labels every other column to avoid overlap */
  hx.textAlign='center';
  for(var ci2=0;ci2<DAYS;ci2++){
    if(ci2%2===0)
      hx.fillText(dayNums[ci2],startX+ci2*(CS+GAP)+CS/2,H-2);
  }
}

function updateReplayUI(){
  var rb=document.getElementById('replay-btn');
  var rc=document.getElementById('replay-ctrls');
  var pp=document.getElementById('replay-pp');
  var prog=document.getElementById('replay-prog');
  if(!rb) return;
  if(replayMode){
    rb.style.display='none';rc.style.display='inline-flex';
    pp.innerHTML=replayPaused?'&#9654;':'&#9646;&#9646;';
    prog.textContent=replayIdx+'/'+(data.candles||[]).length;
  } else {
    rb.style.display='';rc.style.display='none';
  }
}
function replayTick(){
  replayTimer=null;
  if(!replayMode||replayPaused) return;
  var total=(data.candles||[]).length;
  if(replayIdx>=total){stopReplay();return;}
  newCandleSet.clear();
  if(_animRaf) cancelAnimationFrame(_animRaf);
  newCandleSet.add(replayIdx);
  animStart=Date.now();
  replayIdx++;
  if(replayIdx>viewStart+viewCount) viewStart=Math.max(0,replayIdx-viewCount);
  updateReplayUI();
  animLoop();
  replayTimer=setTimeout(replayTick,REPLAY_MS[replaySpeedIdx]);
}
function startReplay(){
  if(replayTimer) clearTimeout(replayTimer);
  replayMode=true;replayIdx=0;replayPaused=false;
  if(viewCount>40) viewCount=40;
  viewStart=0;hovIdx=-1;kbMode=false;
  newCandleSet.clear();
  if(_animRaf) cancelAnimationFrame(_animRaf);
  updateReplayUI();render();
  replayTimer=setTimeout(replayTick,400);
}
function stopReplay(){
  replayMode=false;replayPaused=false;
  if(replayTimer){clearTimeout(replayTimer);replayTimer=null;}
  newCandleSet.clear();
  hovIdx=-1;kbMode=false;
  viewStart=Math.max(0,(data.candles||[]).length-viewCount);
  updateReplayUI();render();
}

function animLoop(){
  if(newCandleSet.size===0) return;
  var t=(Date.now()-animStart)/ANIM_MS;
  render();
  if(t<1) _animRaf=requestAnimationFrame(animLoop);
  else { newCandleSet.clear(); render(); }
}

/* ── stats + streak ─────────────────────────────── */
function renderStats(cc){
  if(!cc.length){statsEl.innerHTML='';return;}
  var net=0,total=0;
  cc.forEach(function(c){
    var d=(c.delta!=null)?c.delta:(c.close-c.open);
    net+=d; total+=Math.abs(d);
  });
  var cls=net>0?'up':net<0?'dn':'neu',sign=net>=0?'+':'';
  var streak=calcStreak(cc);
  var streakHtml='';
  if(streak){
    var scls=streak.dir>0?'up':'dn';
    var slabel=streak.dir>0?'连阳':'连阴';
    streakHtml='<div class="stat"><div class="stat-label">连续走势</div>'+
               '<div class="stat-value '+scls+'">'+streak.count+' '+slabel+'</div></div>';
  }
  statsEl.innerHTML=
    '<div class="stat"><div class="stat-label">编辑次数</div><div class="stat-value neu">'+cc.length+'</div></div>'+
    '<div class="stat"><div class="stat-label">总操作行数</div><div class="stat-value neu">'+total+' 行</div></div>'+
    '<div class="stat"><div class="stat-label">累计净变化</div><div class="stat-value '+cls+'">'+sign+net+' 行</div></div>'+
    streakHtml;
  if(!replayMode&&cc.length!==_tickerLen){_tickerLen=cc.length;updateTicker(cc);}
}

/* ── ticker tape ────────────────────────────────── */
function updateTicker(cc){
  if(!cc.length){tickerEl.innerHTML='正在等待编辑&hellip;';return;}
  var recent=cc.slice(-30);
  var items=recent.map(function(c){
    var d=(c.delta!=null)?c.delta:(c.close-c.open);
    var sign=d>=0?'+':'';
    var dcol=d>0?'var(--up)':d<0?'var(--dn)':'var(--muted)';
    var dotcol=extColor(c.file||'');
    var name=(c.file||'—').split('/').pop();
    return '<span style="color:var(--muted)">' +
           '<span style="color:'+dotcol+'">&bull;</span> '+name+
           ' <span style="color:'+dcol+'">'+sign+d+'</span></span>';
  }).join('<span style="color:var(--border)">&nbsp;&nbsp;&middot;&nbsp;&nbsp;</span>');
  var sep='<span style="color:var(--border)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>';
  var full=items+sep+items;
  tickerEl.innerHTML=full;
  /* reset animation */
  var dur=Math.max(12,recent.length*1.5);
  /* restart without touching play-state so CSS :hover rule works */
  tickerEl.style.animationName='none';
  tickerEl.offsetHeight; /* reflow */
  tickerEl.style.animationName='ticker-scroll';
  tickerEl.style.animationDuration=dur+'s';
  tickerEl.style.animationTimingFunction='linear';
  tickerEl.style.animationIterationCount='infinite';
  tickerEl.style.animationPlayState=''; /* let CSS :hover control this */
}

/* ── leaderboard ────────────────────────────────── */
function renderLeaderboard(cc){
  if(!cc.length){
    lbBody.innerHTML='<div style="color:var(--muted);font-size:10px;text-align:center;padding:16px 0">暂无数据</div>';
    return;
  }
  var stats={};
  cc.forEach(function(c){
    var f=c.file||'—';
    if(!stats[f]) stats[f]={edits:0,net:0};
    stats[f].edits++;
    stats[f].net+=(c.delta!=null)?c.delta:(c.close-c.open);
  });
  lbBody.innerHTML=Object.keys(stats)
    .sort(function(a,b){return stats[b].edits-stats[a].edits;})
    .map(function(file){
      var s=stats[file],cls=s.net>0?'up':s.net<0?'dn':'neu',sign=s.net>=0?'+':'';
      var col=extColor(file),name=file.indexOf('/')>=0?file.split('/').pop():file;
      var act=focusFile===file;
      return '<div class="lb-row'+(act?' active':'')+'" data-file="'+file+'">' +
        '<span class="lb-dot" style="background:'+col+'"></span>'+
        '<span class="lb-file" title="'+file+'">'+name+'</span>'+
        '<span class="lb-edits">'+s.edits+'x</span>'+
        '<span class="lb-net '+cls+'">'+sign+s.net+'</span></div>';
    }).join('');
}

/* ── minimap nav ────────────────────────────────── */
function updateViewFromMini(mx,rw){
  var cc=data.candles||[];
  var totalN=Math.max(cc.length,1),miniW=rw-ML-MR;
  var frac=Math.max(0,Math.min(1,(mx-ML)/miniW));
  var center=Math.round(frac*totalN);
  viewStart=Math.max(0,Math.min(center-Math.round(viewCount/2),Math.max(0,totalN-1)));
  render();
}

/* ── events: zoom ────────────────────────────────── */
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  var cc=data.candles||[],rect=canvas.getBoundingClientRect(),cw=rect.width-ML-MR;
  var frac,pivot;
  if(hovIdx>=0){
    frac=Math.max(0,Math.min(1,hovIdx/viewCount));
    pivot=viewStart+hovIdx;
  } else {
    frac=Math.max(0,Math.min(1,(e.clientX-rect.left-ML)/cw));
    pivot=viewStart+frac*viewCount;
  }
  var factor=e.deltaY>0?1.22:.82;
  viewCount=Math.round(Math.max(5,Math.min(cc.length+30,viewCount*factor)));
  viewStart=Math.max(0,Math.round(pivot-frac*viewCount));
  try{var sv2=JSON.parse(localStorage.getItem('kline_prefs')||'{}');sv2.viewCount=viewCount;localStorage.setItem('kline_prefs',JSON.stringify(sv2));}catch(e){}
  kbMode=false; render();
},{passive:false});

/* ── events: pan / minimap ───────────────────────── */
canvas.addEventListener('mousedown',function(e){
  var rect=canvas.getBoundingClientRect(),cy=e.clientY-rect.top;
  if(cy>=_miniTopY){miniDrag=true;updateViewFromMini(e.clientX-rect.left,rect.width);}
  else{dragging=true;dragX=e.clientX;dragView=viewStart;canvas.style.cursor='grabbing';}
  kbMode=false;
});
window.addEventListener('mousemove',function(e){
  if(miniDrag){var rect=canvas.getBoundingClientRect();updateViewFromMini(e.clientX-rect.left,rect.width);}
  else if(dragging){
    var cc=data.candles||[],rect=canvas.getBoundingClientRect();
    var slotW2=(rect.width-ML-MR)/viewCount;
    var dx=Math.round((dragX-e.clientX)/slotW2);
    viewStart=Math.max(0,Math.min(dragView+dx,Math.max(0,cc.length-1)));
    if(dx!==0){tailLock=true;updateTailBtn();}
    render();
  }
});
window.addEventListener('mouseup',function(){dragging=false;miniDrag=false;canvas.style.cursor='crosshair';});

/* ── events: hover ───────────────────────────────── */
canvas.addEventListener('mousemove',function(e){
  if(dragging||miniDrag) return;
  var rect=canvas.getBoundingClientRect(),cy=e.clientY-rect.top;
  if(cy>=_miniTopY){
    canvas.style.cursor='ew-resize';
    if(hovIdx!==-1||_crossY!==-1){hovIdx=-1;_crossY=-1;tooltip.style.display='none';render();}
    return;
  }
  var cx_raw=e.clientX-rect.left;
  /* commit diamond hover */
  var prevHC=_hovCommit; _hovCommit=null;
  for(var chi=0;chi<_commitHits.length;chi++){
    var ch=_commitHits[chi];
    if(Math.abs(cx_raw-ch.x)<=7&&Math.abs(cy-ch.y)<=9){_hovCommit=ch.cm;break;}
  }
  if(_hovCommit!==prevHC) schedRender();
  if(_hovCommit){
    canvas.style.cursor='pointer';
    if(tipTimer){clearTimeout(tipTimer);tipTimer=null;}
    var _cm2=_hovCommit,_cmx=cx_raw,_cmy=cy,_cmW=rect.width,_cmH=rect.height;
    hovIdx=-1;
    tipTimer=setTimeout(function(){showCommitTip(_cm2,_cmx,_cmy,_cmW,_cmH);},80);
    return;
  }
  if(prevHC&&!_hovCommit) tooltip.style.display='none';
  /* session boundary hover */
  var prevHS=_hovSession; _hovSession=null;
  for(var sbi=0;sbi<_sessionBounds.length;sbi++){
    if(Math.abs(cx_raw-_sessionBounds[sbi].x)<=6){_hovSession=_sessionBounds[sbi];break;}
  }
  if(_hovSession!==prevHS) schedRender();
  if(_hovSession){
    canvas.style.cursor='col-resize';
    if(tipTimer){clearTimeout(tipTimer);tipTimer=null;}
    var _sb=_hovSession,_sbx=cx_raw,_sby=cy,_sbW=rect.width,_sbH=rect.height;
    tipTimer=setTimeout(function(){showSessionTip(_sb,_sbx,_sby,_sbW,_sbH);},80);
    return;
  }
  if(prevHS&&!_hovSession) tooltip.style.display='none';
  canvas.style.cursor='crosshair'; kbMode=false;
  var cc=data.candles||[]; if(!cc.length) return;
  var slotW2=(rect.width-ML-MR)/viewCount;
  var idx=Math.floor((e.clientX-rect.left-ML)/slotW2);
  var vis2=getCachedCC2().slice(viewStart,viewStart+viewCount);
  _crossY=cy;
  if(tipTimer){clearTimeout(tipTimer);tipTimer=null;}
  if(idx>=0&&idx<vis2.length){
    var _idx=idx,_c=vis2[idx],_mx=e.clientX-rect.left,_my=cy,_W=rect.width,_H=rect.height;
    hovIdx=idx; schedRender();
    tipTimer=setTimeout(function(){showTip(_c,_mx,_my,_W,_H);},120);
  } else {
    if(hovIdx!==-1){hovIdx=-1;tooltip.style.display='none';}
    schedRender();
  }
});
canvas.addEventListener('mouseleave',function(){
  if(tipTimer){clearTimeout(tipTimer);tipTimer=null;}
  hovIdx=-1;_crossY=-1;kbMode=false;_hovCommit=null;_hovSession=null;tooltip.style.display='none';render();
});

/* ── events: keyboard navigation ─────────────────── */
document.addEventListener('keydown',function(e){
  var cc=data.candles||[]; if(!cc.length) return;
  /* ignore if typing in an input */
  var tag=(e.target.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA') return;

  var allCC2=getCachedCC2();
  var vis=allCC2.slice(viewStart,viewStart+viewCount);

  switch(e.key){
    case 'ArrowRight':
      e.preventDefault(); kbMode=true;
      if(hovIdx===-1) hovIdx=0;
      else if(hovIdx<vis.length-1) hovIdx++;
      else if(viewStart+viewCount<cc.length){viewStart++;hovIdx=vis.length-1;}
      render(); break;

    case 'ArrowLeft':
      e.preventDefault(); kbMode=true; tailLock=true; updateTailBtn();
      if(hovIdx===-1) hovIdx=vis.length-1;
      else if(hovIdx>0) hovIdx--;
      else if(viewStart>0){viewStart--;hovIdx=0;}
      render(); break;

    case ' ': case 'End':
      e.preventDefault(); kbMode=true;
      tailLock=false; updateTailBtn();
      viewStart=Math.max(0,cc.length-viewCount);
      hovIdx=Math.min(viewCount-1,cc.length-viewStart-1);
      render(); break;

    case 'Home':
      e.preventDefault(); kbMode=true;
      viewStart=0; hovIdx=0; render(); break;

    case '+': case '=':
      e.preventDefault();
      {var anc=hovIdx>=0?viewStart+hovIdx:viewStart+Math.floor(viewCount/2);
       viewCount=Math.max(5,Math.round(viewCount*.82));
       viewStart=Math.max(0,Math.round(anc-viewCount/2));
       try{var svk=JSON.parse(localStorage.getItem('kline_prefs')||'{}');svk.viewCount=viewCount;localStorage.setItem('kline_prefs',JSON.stringify(svk));}catch(ex){}
       render();} break;

    case '-': case '_':
      e.preventDefault();
      {var anc2=hovIdx>=0?viewStart+hovIdx:viewStart+Math.floor(viewCount/2);
       viewCount=Math.min(cc.length+30,Math.round(viewCount*1.22));
       viewStart=Math.max(0,Math.round(anc2-viewCount/2));
       try{var svk2=JSON.parse(localStorage.getItem('kline_prefs')||'{}');svk2.viewCount=viewCount;localStorage.setItem('kline_prefs',JSON.stringify(svk2));}catch(ex){}
       render();} break;

    case 'Escape':
      e.preventDefault();
      focusFile=null; hovIdx=-1; _crossY=-1; kbMode=false;
      tooltip.style.display='none'; render(); break;
  }
});

/* ── heat-canvas hover tooltip ────────────────────── */
(function(){
  var hc=document.getElementById('heat-canvas');
  if(!hc) return;
  var tip=document.getElementById('heat-tip');
  if(!tip){tip=document.createElement('div');tip.id='heat-tip';document.body.appendChild(tip);}
  var DAYS=14,GAP=1,ML_H=16,MR_H=2,MT_H=2;
  function cellAt(e){
    var W=hc.offsetWidth;
    var lb2=document.getElementById('leaderboard');
    var lbH2=lb2?lb2.offsetHeight:9999;
    var maxCS2=Math.max(5,Math.floor((lbH2*0.5-(MT_H+12+(24-1)*GAP))/24));
    var CS=Math.max(5,Math.min(maxCS2,Math.floor((W-ML_H-MR_H-(DAYS-1)*GAP)/DAYS)));
    var gridW=DAYS*(CS+GAP)-GAP;
    var sx=ML_H+Math.floor(Math.max(0,W-ML_H-MR_H-gridW)/2);
    var rect=hc.getBoundingClientRect();
    var mx=e.clientX-rect.left,my=e.clientY-rect.top;
    var ci=Math.floor((mx-sx)/(CS+GAP)),h=Math.floor((my-MT_H)/(CS+GAP));
    return (ci>=0&&ci<DAYS&&h>=0&&h<24)?{ci:ci,h:h}:null;
  }
  hc.addEventListener('mousemove',function(e){
    var cell=cellAt(e);
    if(!cell){tip.style.display='none';return;}
    var today=new Date(); today.setHours(0,0,0,0);
    var dt=new Date(today); dt.setDate(dt.getDate()-(DAYS-1-cell.ci));
    var ds=(dt.getMonth()+1).toString().padStart(2,'0')+'-'+dt.getDate().toString().padStart(2,'0');
    var cnt=0;
    (data.candles||[]).forEach(function(c){
      var d=new Date(c.time);
      var cds=(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
      if(cds===ds&&d.getHours()===cell.h) cnt++;
    });
    var h2=(cell.h+1)%24;
    var col=cnt>0?ghGreen(cnt,Math.max(cnt,5)):'var(--muted)';
    tip.innerHTML=
      '<span style="color:var(--muted)">'+(dt.getMonth()+1)+'/'+dt.getDate()+
      '  '+cell.h.toString().padStart(2,'0')+':00–'+h2.toString().padStart(2,'0')+':00</span><br>'+
      '<span style="color:'+col+'">'+(cnt?cnt+' 次编辑':'无编辑')+'</span>';
    tip.style.display='block';
    var tx=e.clientX+14,ty=e.clientY-44;
    if(tx+140>window.innerWidth-8) tx=e.clientX-154;
    if(ty<8) ty=8;
    tip.style.left=tx+'px'; tip.style.top=ty+'px';
  });
  hc.addEventListener('mouseleave',function(){tip.style.display='none';});
})();
/* ── sidebar resize & collapse ────────────────────── */
(function(){
  var lb=document.getElementById('leaderboard');
  var edge=document.getElementById('sb-edge');
  var btn=document.getElementById('sb-toggle');
  if(!lb||!edge||!btn) return;
  var sbW=178,sbCollapsed=false;
  lb.style.width=sbW+'px';
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    sbCollapsed=!sbCollapsed;
    lb.classList.toggle('sb-collapsed',sbCollapsed);
    btn.innerHTML=sbCollapsed?'&#8250;':'&#8249;';
    try{var sv=JSON.parse(localStorage.getItem('kline_prefs')||'{}');sv.sbCollapsed=sbCollapsed;sv.sbW=sbW;localStorage.setItem('kline_prefs',JSON.stringify(sv));}catch(e){}
    setTimeout(function(){render();},200);
  });
  var dragX=0,dragW=0,draggingSB=false;
  edge.addEventListener('mousedown',function(e){
    if(e.target===btn) return;
    draggingSB=true; dragX=e.clientX; dragW=lb.offsetWidth;
    document.body.style.cursor='col-resize'; document.body.style.userSelect='none';
    e.preventDefault();
  });
  window.addEventListener('mousemove',function(e){
    if(!draggingSB) return;
    sbW=Math.max(140,Math.min(420,dragW+(dragX-e.clientX)));
    if(!sbCollapsed){lb.style.width=sbW+'px';}
    schedRender();
  });
  window.addEventListener('mouseup',function(){
    if(draggingSB){
      draggingSB=false;document.body.style.cursor='';document.body.style.userSelect='';
      try{var sv=JSON.parse(localStorage.getItem('kline_prefs')||'{}');sv.sbW=sbW;localStorage.setItem('kline_prefs',JSON.stringify(sv));}catch(e){}
    }
  });
})();
/* ── localStorage persistence ──────────────────────── */
(function(){
  try{
    var sv=JSON.parse(localStorage.getItem('kline_prefs')||'{}');
    if(sv.viewCount) viewCount=Math.max(5,Math.min(300,sv.viewCount));
    var lb=document.getElementById('leaderboard');
    var btn=document.getElementById('sb-toggle');
    // sidebar width — applied before the resize IIFE runs, overwrite its default
    if(sv.sbW&&lb){lb.style.width=sv.sbW+'px';}
    if(sv.sbCollapsed&&lb&&btn){
      lb.classList.add('sb-collapsed');
      btn.innerHTML='&#8250;';
    }
  }catch(e){}
})();
function updateTailBtn(){
  var b=document.getElementById('tail-btn'); if(!b) return;
  if(tailLock){b.textContent='\u2296 \u5386\u53f2';b.classList.remove('active');}
  else{b.textContent='\u2193 \u8ffd\u5c3e';b.classList.add('active');}
}
document.getElementById('tail-btn').addEventListener('click',function(){
  tailLock=false; updateTailBtn();
  var cc=data.candles||[];
  viewStart=Math.max(0,cc.length-viewCount);
  hovIdx=-1; render();
});
initView(); setLastUpdate(); render();
new ResizeObserver(function(){render();}).observe(canvas.parentElement);

/* ── polling ─────────────────────────────────────── */
var lastSig=JSON.stringify({c:data.candles,k:data.commits});
var indEl=document.createElement('span');
indEl.style.cssText='font-size:10px;color:var(--muted);margin-left:6px';
lastUpEl.after(indEl);

function poll(){
  fetch('kline_data.json?t='+Date.now())
    .then(function(r){return r.ok?r.json():null;})
    .then(function(fresh){
      if(!fresh) return;
      var sig=JSON.stringify({c:fresh.candles,k:fresh.commits});
      if(sig===lastSig) return;
      var prevLen=(data.candles||[]).length;
      var atEdge=viewStart+viewCount>=prevLen;
      lastSig=sig;
      /* mark new candles for animation */
      newCandleSet.clear();
      if(_animRaf) cancelAnimationFrame(_animRaf);
      for(var ni=prevLen;ni<(fresh.candles||[]).length;ni++) newCandleSet.add(ni);
      animStart=Date.now();
      data.candles=fresh.candles||[]; data.commits=fresh.commits||[];
      if(atEdge&&!tailLock) viewStart=Math.max(0,data.candles.length-viewCount);
      setLastUpdate();
      if(newCandleSet.size>0) animLoop(); else render();
      indEl.style.color='var(--up)';
      indEl.textContent='● 已更新 '+new Date().toLocaleTimeString();
      setTimeout(function(){indEl.style.color='var(--muted)';},2000);
    }).catch(function(){});
}
if(location.protocol!=='file:'){setInterval(poll,2000);indEl.textContent='⟳ 实时模式';}

})();
</script>
